schema: evopilot-project-harness-profile/v1
profileId: default
projectId: example-management-software
name: Example Management Software Harness Profile
template:
  templateId: generic-management-software-harness
  version: 1.1.0
runtime:
  commands:
    install: [make install]
    lint: [make lint]
    typecheck: [make build]
    unit: [make test]
    smoke: [make smoke]
observability:
  structuredLogs:
    requiredFields: [tenantId, workspaceId, actorId, role, businessObject, recordId, workflowState, errorCode]
failureHandling:
  requiredFields: [errorCode, businessObject, recordId, actorId, tenantId, userAction, nextAction]
governance:
  profileActivationRequiresApproval: true
  noSilentProfileMutation: true

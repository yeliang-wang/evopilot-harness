schema: evopilot-project-harness-profile/v1
profileId: default
projectId: example-go-middleware
name: Example Go Middleware Harness Profile
template:
  templateId: go-middleware-harness
  version: 1.1.0
runtime:
  commands:
    install: [go mod download]
    lint: [go vet ./...]
    typecheck: [go test ./... -run TestNonExistent]
    unit: [go test ./...]
    smoke: [go test ./... -race]
observability:
  structuredLogs:
    requiredFields: [requestId, traceId, component, controller, resource, errorCode]
failureHandling:
  requiredFields: [errorCode, requestId, traceId, component, retryable, nextAction]
governance:
  profileActivationRequiresApproval: true
  noSilentProfileMutation: true

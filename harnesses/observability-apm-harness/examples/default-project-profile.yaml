schema: evopilot-project-harness-profile/v1
profileId: default
projectId: example-observability-platform
name: Example Observability Platform Harness Profile
template:
  templateId: observability-apm-harness
  version: 1.1.0
runtime:
  commands:
    install: [make deps]
    lint: [make lint]
    typecheck: [make build]
    unit: [make test]
    smoke: [make smoke]
observability:
  structuredLogs:
    requiredFields: [traceId, spanId, service.name, pipeline, signal, tenantId, errorCode, droppedCount]
  metrics:
    requiredSignals: [ingestion_rate, dropped_spans, query_latency, alert_delivery_latency]
failureHandling:
  requiredFields: [errorCode, component, pipeline, signal, tenantId, retryable, droppedCount, nextAction]
governance:
  profileActivationRequiresApproval: true
  noSilentProfileMutation: true

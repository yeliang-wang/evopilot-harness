name: NPM Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Separately authorized release tag, for example v4.1.2"
        required: true
        type: string

      candidate_run_id:
        description: "Successful accepted Release Candidate run ID"
        required: true
        type: string
      candidate_artifact_digest:
        description: "Accepted Actions artifact sha256 digest"
        required: true
        type: string
      candidate_package_digest:
        description: "Accepted npm tarball sha256 digest"
        required: true
        type: string

concurrency:
  group: npm-package-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify Trusted Publishing runtime
        run: |
          set -euo pipefail
          node scripts/verify-npm-trusted-publishing-runtime.mjs
          npm install --global npm@11.5.1
          node --version
          NPM_VERSION="$(npm --version)"
          echo "$NPM_VERSION"
          NPM_VERSION="$NPM_VERSION" node -e 'const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'

      - name: Verify exact accepted Candidate release set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_PACKAGE_DIGEST: ${{ inputs.candidate_package_digest }}
        run: node scripts/prepare-candidate-promotion.mjs

      - name: Verify Roadmap release alignment
        run: npm run roadmap:release -- "$(node -p "require('./package.json').version")"

      - name: Bind package and release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_NAME" != "@evopilot/harness" ]; then
            echo "::error::Unexpected npm package identity: $PACKAGE_NAME"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-alpha.*) DIST_TAG=alpha ;;
            *-beta.*) DIST_TAG=beta ;;
            *-rc.*) DIST_TAG=rc ;;
            *) DIST_TAG=latest ;;
          esac
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      - name: Detect already-published exact version
        run: |
          set -euo pipefail
          PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME@$VERSION" version --json 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "\"$VERSION\"" ]; then
            echo "PACKAGE_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "Resuming verification for existing $PACKAGE_NAME@$VERSION."
          else
            echo "PACKAGE_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Publish with npm Trusted Publishing
        if: env.PACKAGE_ALREADY_PUBLISHED != 'true'
        run: npm publish "$CANDIDATE_TARBALL" --ignore-scripts --access public --provenance --tag "$DIST_TAG"

      - name: Verify registry metadata and attestation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if npm view "$PACKAGE_NAME@$VERSION" --json > npm-metadata.json 2>/dev/null && npm view "$PACKAGE_NAME" dist-tags --json > npm-dist-tags.json 2>/dev/null; then
              break
            fi
            sleep 15
          done
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('npm-metadata.json', 'utf8'));
          const distTags = JSON.parse(fs.readFileSync('npm-dist-tags.json', 'utf8'));
          if (value.name !== process.env.PACKAGE_NAME || value.version !== process.env.VERSION) throw new Error('npm identity mismatch');
          if (distTags?.[process.env.DIST_TAG] !== process.env.VERSION) throw new Error('npm dist-tag mismatch');
          const expectedIntegrity = 'sha512-' + require('crypto').createHash('sha512').update(fs.readFileSync(process.env.CANDIDATE_TARBALL)).digest('base64');
          if (value.dist?.integrity !== expectedIntegrity) throw new Error('Published npm bytes differ from accepted Candidate');
          if (!Array.isArray(value.dist?.signatures) || value.dist.signatures.length === 0) throw new Error('npm signatures are missing');
          if (value.dist?.attestations?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') throw new Error('SLSA provenance is missing');
          NODE

      - name: Verify exact public package install
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$PACKAGE_NAME@$VERSION"
          for attempt in $(seq 1 20); do
            if npm audit signatures; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::npm signatures or provenance did not become available after bounded retries"
              exit 1
            fi
            sleep 15
          done
          npx --no-install evopilot-harness --version --json
          npx --no-install evopilot-harness agent bootstrap --host generic --workspace "$TEMP_DIR/workspace" --json
          npx --yes --package "$PACKAGE_NAME@$VERSION" evopilot-harness --version --json

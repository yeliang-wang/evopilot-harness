name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.1.0"
        required: true
        type: string
      publish_ghcr:
        description: "Publish GHCR only when separately authorized"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-artifacts-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-artifacts:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/evopilot-harness
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate release tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "TAG_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check
        run: npm run check

      - name: Verify Roadmap release alignment
        run: npm run roadmap:release -- "$VERSION"

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ghcr }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ghcr }}
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=EvoPilot Harness
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Resolve optional image metadata
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [ -n "$IMAGE_DIGEST" ]; then
            echo "EVOPILOT_HARNESS_IMAGE_REF=$IMAGE_REPOSITORY:$VERSION" >> "$GITHUB_ENV"
            echo "EVOPILOT_HARNESS_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          fi

      - name: Restore release source checkout
        run: |
          set -euo pipefail
          git restore --worktree --staged .
          STATUS="$(git status --porcelain)"
          if [ -n "$STATUS" ]; then
            echo "::error::Release checkout is not clean after restoring generated validation outputs"
            git status --short
            exit 1
          fi

      - name: Build release artifacts
        env:
          EVOPILOT_RELEASE_CHECK_ALREADY_PASSED: "true"
        run: GITHUB_REF_NAME="$RELEASE_TAG" npm run release:artifact

      - name: Verify release artifacts
        run: npm run verify:release-artifact

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing release notes $NOTES_FILE"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "EvoPilot Harness $RELEASE_TAG" --notes-file "$NOTES_FILE" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" --title "EvoPilot Harness $RELEASE_TAG" --notes-file "$NOTES_FILE" --target "$TAG_COMMIT"
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber

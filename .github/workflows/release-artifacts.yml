name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.1.0"
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-artifacts:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/evopilot-harness
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate release tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check
        run: npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=EvoPilot Harness
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

      - name: Restore release source checkout
        run: git restore harness-registry.yaml published

      - name: Build release artifacts
        env:
          CI: "false"
          EVOPILOT_HARNESS_IMAGE_REF: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
          EVOPILOT_HARNESS_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" npm run release:artifact

      - name: Verify release artifacts
        run: npm run verify:release-artifact

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing release notes $NOTES_FILE"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "EvoPilot Harness $RELEASE_TAG" --notes-file "$NOTES_FILE" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" --title "EvoPilot Harness $RELEASE_TAG" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber

name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Separately authorized release tag"
        required: true
        type: string
      candidate_run_id:
        description: "Successful accepted Release Candidate run ID"
        required: true
        type: string
      candidate_artifact_digest:
        description: "Accepted Actions artifact sha256 digest"
        required: true
        type: string
      candidate_package_digest:
        description: "Accepted npm tarball sha256 digest"
        required: true
        type: string

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release-artifacts:
    name: Promote Accepted Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
      CANDIDATE_PACKAGE_DIGEST: ${{ inputs.candidate_package_digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact accepted Candidate release set
        run: node scripts/prepare-candidate-promotion.mjs
      - name: Verify Roadmap release alignment
        run: npm run roadmap:release -- "$(node -p "require('./package.json').version")"
      - name: Publish accepted files without replacing existing assets
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NOTES_FILE="docs/releases/$VERSION.md"
          test -f "$NOTES_FILE"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "EvoPilot Harness $RELEASE_TAG" --notes-file "$NOTES_FILE"
          fi
          READBACK="$(mktemp -d)"
          export READBACK
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets > "$READBACK/release.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const release=JSON.parse(fs.readFileSync(path.join(process.env.READBACK,'release.json')));
          assert.equal(release.isDraft,false);assert.equal(release.isPrerelease,false);
          const files=fs.readdirSync('dist/release').sort(),existing=release.assets.map(a=>a.name);
          assert.equal(new Set(existing).size,existing.length);
          assert.ok(existing.every(name=>files.includes(name)),'UNEXPECTED_RELEASE_ASSET');
          for(const name of files){
            if(existing.includes(name)){
              execFileSync('gh',['release','download',process.env.RELEASE_TAG,'--pattern',name,'--dir',process.env.READBACK]);
              assert.deepEqual(fs.readFileSync(path.join(process.env.READBACK,name)),fs.readFileSync(path.join('dist/release',name)),'EXISTING_RELEASE_BYTES_DIFFER');
            }else execFileSync('gh',['release','upload',process.env.RELEASE_TAG,path.join('dist/release',name)]);
          }
          NODE
          VERIFY="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$VERIFY"
          diff -r dist/release "$VERIFY"
